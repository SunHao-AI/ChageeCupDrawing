<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>CupDraw E2E Target</title>
    <style>
      /* 背景中性灰，画板纯白。画板用 vh + aspect-ratio 定尺寸（高=70vh，
         宽高比 2:3）：相对视口与 DPI 无关，白区恒占截图高 ~70%、宽 ~56%
         （窗口 640x780 下），稳居 canvas_detect 的 42–92% / 34–82% 安全区。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #888;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #board {
        height: 70vh;
        aspect-ratio: 2 / 3;
        background: #fff;
        touch-action: none;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="board"><canvas id="c"></canvas></div>
    <script>
      // 模拟小程序画板：指针事件画线，笔画数写进 document.title，
      // 供外部验证脚本通过窗口标题读取（Chrome --app 窗口标题=页面标题）。
      const board = document.getElementById('board')
      const canvas = document.getElementById('c')
      const ctx = canvas.getContext('2d')
      const fit = () => {
        canvas.width = board.clientWidth
        canvas.height = board.clientHeight
        ctx.lineWidth = 3
        ctx.lineCap = 'round'
        ctx.strokeStyle = '#111'
      }
      fit()
      addEventListener('resize', fit)
      let strokes = 0
      let drawing = false
      const pos = (e) => {
        const r = canvas.getBoundingClientRect()
        return [((e.clientX - r.left) * canvas.width) / r.width, ((e.clientY - r.top) * canvas.height) / r.height]
      }
      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault()
        canvas.setPointerCapture(e.pointerId)
        drawing = true
        const [x, y] = pos(e)
        ctx.beginPath()
        ctx.moveTo(x, y)
      })
      canvas.addEventListener('pointermove', (e) => {
        if (!drawing) return
        e.preventDefault()
        const [x, y] = pos(e)
        ctx.lineTo(x, y)
        ctx.stroke()
      })
      const end = (e) => {
        if (!drawing) return
        e.preventDefault()
        drawing = false
        strokes += 1
        document.title = `CupDraw E2E Target [${strokes}]`
      }
      canvas.addEventListener('pointerup', end)
      canvas.addEventListener('pointercancel', end)
    </script>
  </body>
</html>
